<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дихателна недостатъчност</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.css">
  <style>
    body { 
      font-family: "Open Sans", Arial, sans-serif; 
      max-width: 1550px; 
      margin: 0.5rem auto; 
      padding: 0 1rem; 
      line-height: 1.8; 
      color: #1f2937; 
    }
    h1, h2, h3, h4 { 
      font-weight: 600; 
      margin-top: 0.8em;
      margin-bottom: 0.3em;
      color: #7c2d12;
    }
    h1 { font-size: 1.5em; }
    h2 { font-size: 1.3em; }
    h3 { font-size: 1.1em; }
    h4 { font-size: 1.05em; }
    h3 + h4 { margin-top: 0.3em; }
    p { 
      margin: 0.7em 0; 
      white-space: pre-wrap;
    }
    p + ul, p + ol { margin-top: -0.5em; }
    h1 + p, h2 + p, h3 + p, h4 + p,
    h1 + ul, h2 + ul, h3 + ul, h4 + ul,
    h1 + ol, h2 + ol, h3 + ol, h4 + ol { 
      margin-top: 0.1em; 
    }
    ul, ol { 
      margin: 0.3em 0; 
      padding-left: 1.5em; 
    }
    li { margin: 0.15em 0; }
    ul ul { list-style-type: circle; }
    ul ul ul { list-style-type: square; }
    strong { font-weight: 600; }
    em { font-style: italic; }
    code { 
      background: rgba(146, 64, 14, 0.1); 
      padding: 2px 6px; 
      border-radius: 3px; 
      font-family: "Courier New", monospace; 
      font-size: 0.9em; 
    }
    pre {
      background: rgba(255, 255, 255, 0.5);
      padding: 12px;
      border-radius: 4px;
      overflow-x: auto;
      margin: 0.5em 0;
      font-family: "Courier New", monospace;
    }
    pre code {
      background: none;
      padding: 0;
    }
    blockquote {
      border-left: 3px solid #f59e0b;
      padding-left: 1em;
      margin: 0.5em 0;
      font-style: italic;
      color: #78350f;
    }
    table { 
      border-collapse: collapse; 
      margin: 0.75em 0; 
      width: 100%; 
      table-layout: auto;
    }
    th, td { 
      border: 1px solid rgba(146, 64, 14, 0.35); 
      padding: 6px 10px; 
      text-align: left; 
      vertical-align: top;
      height: 24px;
      line-height: 1.2;
    }
    thead th { 
      background: rgba(196, 127, 9, 0.08); 
      font-weight: 600; 
    }
    tbody tr:nth-child(odd) { 
      background: rgba(146, 64, 14, 0.03); 
    }
    img { 
      max-width: 100%; 
      height: auto; 
    }
    a { 
      color: #f59e0b; 
      text-decoration: underline; 
    }
    a:hover {
      color: #d97706;
    }
    @media (max-width: 768px) {
      body {
        max-width: 100%;
        margin: 0.5rem 0;
        padding: 0 0.5rem;
        font-size: 16px;
      }
      h1 { font-size: 1.3em; }
      h2 { font-size: 1.1em; }
      h3 { font-size: 1em; }
      p { margin: 0.5em 0; }
      ul, ol { padding-left: 1.2em; }
      li { margin: 0.1em 0; }
      table { font-size: 0.9em; }
      th, td { padding: 4px 6px; }
    }
  </style>
</head>
<body>
<p>Нищо</p>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/contrib/auto-render.min.js"></script>
<script>
renderMathInElement(document.body, {
  delimiters: [
    {left: '$$', right: '$$', display: true},
    {left: '$', right: '$', display: false}
  ]
});
</script>
</body>
</html>
